services:
  plugin.manager.reward_type:
    class: Drupal\reward\RewardTypePluginManager
    parent: default_plugin_manager

  reward.event_subscriber:
    class: Drupal\reward\EventSubscriber\RewardSubscriber
    arguments: ['@plugin.manager.reward_type']
    tags:
      - { name: event_subscriber }

  reward.claim:
    class: Drupal\reward\ClaimManager
    arguments: ['@entity_type.manager', '@account.finance_manager', '@lock', '@event_dispatcher']
